<script>
/* 이 앱은 회원가입·게시판·AI 상담에 /api 서버가 필요하다.
   GitHub Pages 같은 정적 호스팅은 index.html·css·js 만 올려 주고 서버는 없다 —
   그 주소에서 '회원가입'을 누르면 /api/auth/signup 이 404(HTML)로 떨어져
   '가입하지 못했어요'만 반복된다(2026-10 실제 신고).
   그래서 정적 미러로 들어온 방문자는 서버가 있는 실제 배포로 바로 보낸다.
   해시(#/account/signup 등)는 그대로 넘겨 원래 보려던 화면을 연다. */
(function () {
  var STATIC_HOSTS = /\.(?:github|gitlab)\.io$/i;
  var CANONICAL = 'https://maeumjeongwon.luxrank.workers.dev';
  if (!STATIC_HOSTS.test(location.hostname || '')) return;
  if (location.hostname === new URL(CANONICAL).hostname) return;
  location.replace(CANONICAL + '/' + (location.hash || ''));
})();
</script>

/* 부트 셸 (SCR-AUTH-001) — css/style.css 를 일부러 부르지 않는다.

<script>
/* 저조도(다크) 모드를 '첫 페인트' 전에 확정한다.
   CSS 는 <html data-theme> 하나만 본다. 여기서 정해 두지 않으면 흰 화면이 한 번 번쩍인 뒤
   어두워진다 — 새벽에 앱을 열었을 때 가장 먼저 보이는 결함이다.
   앱 상태(JSON)는 아직 없고, 있어도 기다릴 수 없다. 그래서 테마 값만 별도 키에 둔다. */
(function () {
  try {
    var saved = localStorage.getItem('maeumjeongwon.theme.v1');
    var dark = saved ? saved === 'dark'
      : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) { /* 저장소를 막은 브라우저는 낮 모드 */ }
})();
</script>

<body>
<!-- 첫 화면을 열지 못했을 때만 나타나는 복구 카드 (SCR-AUTH-001).
     정상 부팅에는 로딩 화면을 띄우지 않는다 — 흰 화면 대신 '다음 행동'만 준다. -->
<div id="boot" role="alert" aria-live="assertive" hidden>
  <div class="boot-card">
    <h1>화면을 열지 못했어요</h1>
    <p class="boot-sub">한지가 젖어 붓이 멈춘 것 같아요. 아래에서 다시 시도해 주세요.</p>
    <p class="boot-net" id="bootNet" hidden></p>
    <div class="boot-actions">
      <button type="button" data-boot="reload" class="primary">새로고침</button>
      <button type="button" data-boot="cache">캐시 초기화</button>
      <button type="button" data-boot="guest">게스트로 보기</button>
    </div>
    <p class="boot-note">게스트로 보면 회원 기능(방문 인증·수첩·게시판)은 로그인 후에 열려요. <a href="#/home">홈으로</a></p>
  </div>
</div>
<script>
/* 부트 카드의 세 가지 문: 새로고침 · 캐시 초기화(서비스워커·캐시만 지운다. 저장한 순례 기록은
   건드리지 않는다) · 게스트로 보기(로그인 벽에 막히지 않기). 카드는 실패했을 때만 열린다. */
(function () {
  var GUEST_KEY = 'maeumjeongwon.guest.v1';
  var boot = document.getElementById('boot');
  if (!boot) return;
  var done = false;

  function hide() {
    if (done) return;
    done = true;
    boot.hidden = true;
    if (boot.parentNode) boot.parentNode.removeChild(boot);
  }
  // 첫 화면을 못 그린 채로 시간이 흐르면 카드를 연다 — 로딩 화면이 아니라 '실패 화면'이다
  function show() {
    if (done) return;
    boot.hidden = false;
  }
  function appReady() {
    var v = document.getElementById('view');
    return !!(v && v.querySelector('section, .card, h1'));
  }
  function net() {
    var el = document.getElementById('bootNet');
    if (!el) return;
    if (navigator.onLine === false) {
      el.hidden = false;
      el.textContent = '네트워크가 끊겨 있어요. 저장해 둔 사찰 정보는 오프라인에서도 열려요.';
    } else {
      el.hidden = true;
    }
  }
  function guest() {
    try { localStorage.setItem(GUEST_KEY, '1'); } catch (e) {}
    document.documentElement.setAttribute('data-guest', '1');
    if (appReady()) {
      hide();
      if (window.MJ_TOAST) window.MJ_TOAST('둘러보기로 시작합니다 · 회원 기능은 로그인 후 열려요');
      return;
    }
    var note = boot.querySelector('.boot-note');
    if (note) note.textContent = '게스트로 기록했어요. 새로고침하면 바로 열립니다.';
    show();
  }
  async function resetCache() {
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        var rs = await navigator.serviceWorker.getRegistrations();
        for (var i = 0; i < rs.length; i++) { try { await rs[i].unregister(); } catch (e) {} }
      }
    } catch (e) {}
    try {
      if (window.caches && caches.keys) {
        var ks = await caches.keys();
        for (var j = 0; j < ks.length; j++) { try { await caches.delete(ks[j]); } catch (e) {} }
      }
    } catch (e) {}
    location.reload();
  }

  boot.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-boot]') : null;
    if (!b) return;
    var act = b.getAttribute('data-boot');
    if (act === 'guest') guest();
    else if (act === 'reload') location.reload();
    else if (act === 'cache') resetCache();
  });
  window.addEventListener('online', net);
  window.addEventListener('offline', net);
  net();
  // 6초: 이 시간 안에 첫 화면이 그려지지 않으면 '기다림'이 아니라 '실패'로 보고 길을 준다
  setTimeout(function () { if (!appReady()) show(); }, 6000);
  // 앱이 스스로 그려지면(=정상 부팅) 안내 문구만 남기고 조용히 걷어 낸다
  window.MJ_BOOT = { hide: hide, show: show, guest: guest, resetCache: resetCache };
  try { if (localStorage.getItem(GUEST_KEY)) document.documentElement.setAttribute('data-guest', '1'); } catch (e) {}
})();
</script>
